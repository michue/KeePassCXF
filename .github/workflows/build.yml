name: CI · Build & Test

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build Release'
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Style and analyzer rules come from .editorconfig via EnforceCodeStyleInBuild.
      # Only CI treats them as errors, so local builds stay warning-tolerant.
      # Both configurations: some analyzers only fire outside #if DEBUG.
      - name: Verify code style
        shell: pwsh
        run: |
          $projects = @(
            'src/KeePassCXFPlugin/KeePassCXFPlugin.csproj',
            'src/KeePassCXFPlugin.Tests/KeePassCXFPlugin.Tests.csproj'
          )
          foreach ($cfg in @('Debug', 'Release')) {
            foreach ($p in $projects) {
              dotnet build $p -c $cfg --nologo -warnaserror
              if ($LASTEXITCODE -ne 0) { throw "Code style check failed ($cfg): $p" }
            }
          }

      - name: Run unit tests
        shell: pwsh
        run: dotnet test --project src/KeePassCXFPlugin.Tests/KeePassCXFPlugin.Tests.csproj -c Debug

      - name: Build (Debug, optimized)
        shell: pwsh
        run: .\scripts\Publish-Package.ps1 -Configuration Debug

      - name: Build (Release)
        if: inputs.build_release
        shell: pwsh
        run: .\scripts\Publish-Package.ps1 -Configuration Release

      - name: Upload Defender scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: defender-scan-report
          path: build\defender-scan-*.txt
          if-no-files-found: ignore

      - name: Upload artifact (Debug, optimized)
        uses: actions/upload-artifact@v7
        with:
          name: KeePassCXF-debug
          path: build\KeePassCXF-*-debug.zip

      - name: Upload artifact (Release)
        if: inputs.build_release
        uses: actions/upload-artifact@v7
        with:
          name: KeePassCXF-release
          path: |
            build\KeePassCXF-*.zip
            !build\KeePassCXF-*-debug.zip
