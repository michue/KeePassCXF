name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open browser and navigate to ...
        2. Click "Sign in with passkey"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: keepass_version
    attributes:
      label: KeePass Version
      placeholder: "e.g. 2.57.1"
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: KeePassCXF Plugin Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Paste any relevant log output. In the KeePassPasskey app open the Diagnostics page,
        pick the Provider log or Plugin log tab and use the copy button there. Please read
        through it before posting rather than pasting it wholesale: logs can contain the
        websites you visited, user names and entry titles, and the Debug log level records
        far more detail. Remove anything you would not want to be public.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: >-
        Any other information that might be relevant, e.g. screenshots or a synthetic CXF example.
        Please do not include any sensitive information you would not want to be public.
    validations:
      required: false
